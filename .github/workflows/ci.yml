name: CI

on:
  push:
    branches: [main, v2-hardening]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12.7"
  NODE_VERSION: "22.12.0"
  # gltest (direct mode) downloads its SDK bundle from genlayerlabs/genvm;
  # genvm-lint validates against genlayerlabs/genvm-manager. Different repos, different tags.
  GENVM_TEST_VERSION: "v0.2.16"
  GENVM_LINT_VERSION: "v0.6.0-rc8"

jobs:
  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: genvm-lint
        env:
          GENVM_VERSION: ${{ env.GENVM_LINT_VERSION }}
        run: ./scripts/ci/run_with_annotation.sh "genvm-lint" genvm-lint check contracts/settleit.py

  test-direct:
    name: Direct Mode Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest direct
        env:
          GENVM_VERSION: ${{ env.GENVM_TEST_VERSION }}
        run: ./scripts/ci/run_with_annotation.sh "direct tests" pytest tests/direct/ -v
      - name: pytest deployment/verification scripts
        run: ./scripts/ci/run_with_annotation.sh "script tests" pytest tests/scripts/ -v

  frontend:
    name: Frontend (test, typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install (lockfile if present)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x7BaDaceAeD80bF571562359E3De02aA1eA8846d8"

  manifest-consistency:
    name: Deployment manifest / source equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node frontend/scripts/check-address-consistency.mjs
